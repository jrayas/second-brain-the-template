type: kb
description: A written knowledge-base note.
uses: [base, findability, relations, review, domain, curriculum, pathways, verification]
overrides:
  status:
    values: [draft, review, published, outdated, archived]
    default: draft
properties:
  kind:
    type: enum
    values: [concept, how-to, reference, troubleshooting, faq, checklist, glossary, case-study, index]
    default: concept
  audience:
    type: enum
    values: [self, team, public]
    default: self
  confidence:
    type: enum
    values: [low, medium, high]
    default: medium
