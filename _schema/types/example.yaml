type: example
description: A worked example applying a concept to concrete numbers or a concrete design.
uses: [base, findability, relations, review, domain, curriculum, pathways, verification]
overrides:
  status:
    values: [draft, review, published, outdated, archived]
    default: draft
properties:
  demonstrates:
    type: link
    target: kb
    required: true
    description: The concept note this example illustrates.
  difficulty:
    type: enum
    values: [beginner, intermediate, advanced, senior]
    required: true
  confidence:
    type: enum
    values: [low, medium, high]
    default: medium
