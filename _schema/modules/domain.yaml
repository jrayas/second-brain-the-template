module: domain
description: Which knowledge domain a note belongs to. The domains are listed in registry/domains.yaml.
properties:
  domain:
    type: enum
    required: true
    values_from: domains
    description: The knowledge domain, from registry/domains.yaml. Add a line there to add a domain; never rename one.
  unique_id:
    type: string
    pattern: '^[A-Z]{2}-[A-Z]{2}-\d{4}-\d{4,}$'
    locked: true
    generated: true
    description: Readable ID within a domain, TYPE-DOMAIN-YEAR-NNNN (for example KB-PC-2026-0046), with its own counter per type, domain and year. Needs a prefix for the domain in registry/domains.yaml. Link to a note by its id, never by this.
